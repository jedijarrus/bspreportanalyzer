services:
  analyzer:
    build: .
    container_name: bsp-report-analyzer
    ports:
      - "${BSP_PORT:-8080}:${BSP_PORT:-8080}"
    environment:
      - BSP_PORT=${BSP_PORT:-8080}
    volumes:
      # Echte Daten leben NUR hier auf dem Host — nie im Image, nie im Repo
      - ./data:/data
    restart: unless-stopped
