services:
  analyzer:
    build: .
    container_name: bsp-report-analyzer
    ports:
      # nur der Host-Port ist konfigurierbar; im Container lauscht uvicorn fix auf 8080
      - "${BSP_PORT:-8080}:8080"
    environment:
      - BSP_HTTPS_ONLY=${BSP_HTTPS_ONLY:-}
      - BSP_BASE_URL=${BSP_BASE_URL:-}
      - BSP_SECRET_KEY=${BSP_SECRET_KEY:-}
      - GRAPH_TENANT_ID=${GRAPH_TENANT_ID:-}
      - GRAPH_CLIENT_ID=${GRAPH_CLIENT_ID:-}
      - GRAPH_CLIENT_SECRET=${GRAPH_CLIENT_SECRET:-}
    volumes:
      # Echte Daten leben NUR hier auf dem Host — nie im Image, nie im Repo
      - ./data:/data
    restart: unless-stopped
